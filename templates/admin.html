<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | YT Stream</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #0f172a; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .glass-input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }
        .glass-input:focus {
            background: rgba(0, 0, 0, 0.4);
            border-color: rgba(99, 102, 241, 0.5);
            outline: none;
        }
    </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-indigo-900 to-black">

    <div class="container max-w-4xl mx-auto">
        
        {% if not logged_in %}
        <!-- Login Form -->
        <div class="glass-panel p-10 rounded-3xl max-w-md mx-auto text-center">
            <h1 class="text-3xl font-bold mb-6 bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400">Admin Login</h1>
            
            {% if error %}
            <div class="bg-red-500/20 text-red-200 p-3 rounded-lg mb-4 text-sm">{{ error }}</div>
            {% endif %}

            <form action="/login" method="POST" class="space-y-4">
                <input type="text" name="username" placeholder="Username" class="glass-input w-full p-3 rounded-xl" required>
                <input type="password" name="password" placeholder="Password" class="glass-input w-full p-3 rounded-xl" required>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 py-3 rounded-xl font-bold transition">Login</button>
            </form>
            <p class="mt-4 text-gray-500 text-sm">Default: admin / admin123</p>
        </div>

        {% else %}
        <!-- Dashboard -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Sidebar -->
            <div class="md:col-span-1 space-y-6">
                <div class="glass-panel p-6 rounded-3xl text-center">
                    <h2 class="text-xl font-bold mb-2">Admin Dashboard</h2>
                    <p class="text-gray-400 text-sm mb-4">Manage your site settings</p>
                    <a href="/" target="_blank" class="block w-full py-2 bg-white/10 hover:bg-white/20 rounded-lg mb-2 text-sm transition">View Site ↗</a>
                    <a href="/logout" class="block w-full py-2 bg-red-500/20 hover:bg-red-500/40 text-red-200 rounded-lg text-sm transition">Logout</a>
                </div>

                <!-- Notepad -->
                <div class="glass-panel p-6 rounded-3xl">
                    <h3 class="text-lg font-semibold mb-4 flex items-center gap-2">📝 Private Notepad</h3>
                    <form action="/admin/save_note" method="POST">
                        <textarea name="content" rows="8" class="glass-input w-full p-3 rounded-xl text-sm" placeholder="Write your ideas here...">{{ note['content'] }}</textarea>
                        <button type="submit" class="w-full mt-3 bg-green-600 hover:bg-green-700 py-2 rounded-lg text-sm font-bold">Save Note</button>
                    </form>
                </div>
            </div>

            <!-- Main Content -->
            <div class="md:col-span-2 space-y-6">
                <div class="glass-panel p-8 rounded-3xl">
                    <h3 class="text-2xl font-bold mb-6 flex items-center gap-2">⚙️ Site Settings</h3>
                    
                    <form action="/admin/update_settings" method="POST" class="space-y-6">
                        
                        <div>
                            <label class="block text-gray-400 text-sm mb-2">📌 Pinned Message (Homepage Top)</label>
                            <input type="text" name="pinned_msg" value="{{ settings['pinned_msg'] }}" class="glass-input w-full p-3 rounded-xl" placeholder="e.g. Server maintenance at 10 PM">
                        </div>

                        <div>
                            <label class="block text-gray-400 text-sm mb-2">🔔 Popup Message (Modal)</label>
                            <textarea name="popup_msg" rows="2" class="glass-input w-full p-3 rounded-xl" placeholder="e.g. Join our Telegram Channel!">{{ settings['popup_msg'] }}</textarea>
                            <p class="text-xs text-gray-500 mt-1">Leave empty to disable popup.</p>
                        </div>

                        <div class="grid grid-cols-1 gap-6">
                            <div>
                                <label class="block text-gray-400 text-sm mb-2">📢 Ad Code 1 (Top)</label>
                                <textarea name="ad_code_1" rows="3" class="glass-input w-full p-3 rounded-xl font-mono text-xs" placeholder="<script>...</script>">{{ settings['ad_code_1'] }}</textarea>
                            </div>
                            
                            <div>
                                <label class="block text-gray-400 text-sm mb-2">📢 Ad Code 2 (Bottom)</label>
                                <textarea name="ad_code_2" rows="3" class="glass-input w-full p-3 rounded-xl font-mono text-xs" placeholder="<script>...</script>">{{ settings['ad_code_2'] }}</textarea>
                            </div>
                        </div>

                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 py-3 rounded-xl font-bold transition shadow-lg shadow-indigo-500/30">Save Settings</button>
                    </form>
                </div>
            </div>
        </div>
        {% endif %}
    </div>

</body>
</html>
